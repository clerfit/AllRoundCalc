name: UI verification

concurrency:
  group: ui-verification-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    name: Source contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run source contract tests
        run: npm test
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js && node --check assets/js/calculations.js && node --check assets/js/advanced-calculations.js && node --check assets/js/physics-calculations.js && node --check assets/js/chemistry-calculations.js && node --check assets/js/statistics-calculations.js && node --check assets/js/finance-calculations.js && node --check assets/js/business-calculations.js && node --check assets/js/health-calculations.js && node --check assets/js/unit-converters.js && node --check assets/js/date-time-calculations.js && node --check scripts/serve.mjs && node --check playwright.config.js

  browser-tests:
    name: Chromium browser tests (desktop, tablet, mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
